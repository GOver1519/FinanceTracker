<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Finance Tracker{% endblock %}</title>

    <!--Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>

<body style="background-image: url('{{ url_for('static', filename='images/background.jpg') }}');">

    <!--Header-->
    <div class="full-width-bar">
        <h1 class="text-center py-2 m-0">Finance Tracker</h1>

        <header class="d-flex justify-content-center pb-3">
            <ul class="nav nav-pills">
                <li class="nav-item">
                    <a href="{{ url_for('index') }}" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('expenses') }}" class="nav-link">Expenses</a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('dashboard') }}" class="nav-link">Dashboard</a>
                </li>
            </ul>
        </header>
    </div>

    <!--Main-->
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main><br><br>

    <!--Footer-->
    <div class="full-width-bar">
        <footer class="d-flex justify-content-between align-items-center py-3 px-3">
            <span>Finance Tracker</span>

            <div>
                <a href="#" class="me-3 text-dark">Instagram</a>
                <a href="#" class="text-dark">Facebook</a>
            </div>
        </footer>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>
</html>
